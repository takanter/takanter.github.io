  <!-- SCRIPT PENCEGAT RESET PASSWORD -->
  <!-- Script ini memeriksa apakah URL mengandung token pemulihan password dari Supabase -->
  <!-- Jika iya, user langsung dialihkan ke halaman reset-password.html statis sebelum mesin Flutter menyala -->
  <script>
    if (window.location.hash && window.location.hash.includes("type=recovery")) {
      window.location.replace("/reset-password.html" + window.location.hash);
    }
